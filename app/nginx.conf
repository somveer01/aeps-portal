# Serves the Expo web bundle (SPA) and reverse-proxies the API + uploads to the
# `api` container on the internal Docker network. This is the public entrypoint.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow reasonably large image uploads (passbook, service icons, etc.).
  client_max_body_size 12m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API — proxied to the Node service.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Uploaded images served by the API.
  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The page itself is re-checked on every load (a cheap 304 when nothing changed), so a new deploy reaches a browser on its very next load
  # instead of an old copy staying in its cache. The SPA fallback below also ends up here (it serves /index.html).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The scripts, styles and fonts under /_expo/static carry a content hash in their name: a new build is a new file name, so they can be
  # kept for a long time.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — every other path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
