name: CI

# Lint + API tests (against a throwaway Postgres) + a production build of the web app.
# It does NOT deploy: deploys are run on purpose with scripts/deploy.sh.
on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_aeps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintech_aeps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: development
      APP_MODE: mock
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fintech_aeps
      PGSSL: "false"
      JOBS_ENABLED: "false"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same as api/Dockerfile
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Migrate and seed a fresh database
        run: |
          npm run migrate
          npm run seed
      - run: npm test

  app:
    name: Web app builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      EXPO_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same as app/Dockerfile
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Export the web bundle (same command as app/Dockerfile)
        run: npx expo export --platform web --output-dir dist
